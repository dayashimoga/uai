[workspace]
resolver = "2"
members = [
    "crates/aissistant-core",
    "crates/aissistant-security",
    "crates/aissistant-storage",
    "crates/aissistant-ffi",
    "crates/aissistant-audio",
    "crates/aissistant-speech",
    "crates/aissistant-llm",
    "crates/aissistant-orchestrator",
    "crates/aissistant-skills",
    "crates/aissistant-platform",
    "crates/aissistant-network",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Universal AI Assistant Contributors"]
license = "Apache-2.0"
repository = "https://github.com/dayashimoga/aissistant"
rust-version = "1.85.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
match_same_arms = "warn"
needless_borrow = "warn"

[workspace.dependencies]
blake3 = "1.5"
byteorder = "1.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
cpal = "0.15"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
hkdf = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.33"
tempfile = "3.17"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
rcgen = "0.13"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
proptest = "1.6"
