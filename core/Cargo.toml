[workspace]
resolver = "2"
members = [
    "crates/aissistant-core",
    "crates/aissistant-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Universal AI Assistant Contributors"]
license = "Apache-2.0"
repository = "https://github.com/dayashimoga/aissistant"
rust-version = "1.85.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
match_same_arms = "warn"
needless_borrow = "warn"

[workspace.dependencies]
blake3 = "1.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
