name: Rust Core CI

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-core-exists:
    name: Check Core Workspace Presence
    runs-on: ubuntu-latest
    outputs:
      has_core: ${{ steps.check.outputs.has_core }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "core/Cargo.toml" ]; then
            echo "has_core=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_core=false" >> "$GITHUB_OUTPUT"
            echo "core/Cargo.toml not yet created (pending Stage 0 S0.P1.1). Skipping Rust jobs."
          fi

  fmt-and-clippy:
    name: Format & Clippy (${{ matrix.os }})
    needs: check-core-exists
    if: needs.check-core-exists.outputs.has_core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Verify Formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

  test-and-coverage:
    name: Unit & Integration Tests (${{ matrix.os }})
    needs: [check-core-exists, fmt-and-clippy]
    if: needs.check-core-exists.outputs.has_core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Run Workspace Tests
        run: cargo test --manifest-path core/Cargo.toml --workspace -- --nocapture

      - name: Enforce Coverage Gate (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate Coverage Report (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo llvm-cov --manifest-path core/Cargo.toml --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --manifest-path core/Cargo.toml --fail-under-lines 90
