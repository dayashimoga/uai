name: Flutter & Five-Platform Builds CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/ci-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-app-exists:
    name: Check Flutter App Presence
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "app/pubspec.yaml" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "app/pubspec.yaml not yet created (pending Stage 1 S1.P3.1). Skipping Flutter jobs."
          fi

  analyze-and-test:
    name: Flutter Analyze & Widget Tests
    needs: check-app-exists
    if: needs.check-app-exists.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dependencies
        working-directory: app
        run: flutter pub get
      - name: Check Dart Formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze Dart Code
        working-directory: app
        run: flutter analyze --no-pub
      - name: Run Flutter Tests
        working-directory: app
        run: flutter test --coverage

  build-desktop:
    name: Desktop Native Build (${{ matrix.target }})
    needs: [check-app-exists, analyze-and-test]
    if: needs.check-app-exists.outputs.has_app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Desktop Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Rust Core Library
        run: cargo build --manifest-path core/Cargo.toml --workspace --release

      - name: Build Flutter Desktop (${{ matrix.target }})
        working-directory: app
        run: |
          flutter config --enable-${{ matrix.target }}-desktop
          flutter pub get
          flutter build ${{ matrix.target }} --release

  build-android:
    name: Android Native Build (APK & AAB)
    needs: [check-app-exists, analyze-and-test]
    if: needs.check-app-exists.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk
      - name: Build Rust Android JNI Libraries
        run: |
          cargo ndk --manifest-path core/Cargo.toml -t arm64-v8a -t x86_64 build --release
      - name: Build Android Release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Prune Intermediate Build Cache (<30 GB Guard)
        if: always()
        run: cargo clean --manifest-path core/Cargo.toml

  build-ios:
    name: iOS Native Build (No-Codesign Archive)
    needs: [check-app-exists, analyze-and-test]
    if: needs.check-app-exists.outputs.has_app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust iOS Static Library
        run: cargo build --manifest-path core/Cargo.toml --target aarch64-apple-ios --release
      - name: Build Flutter iOS Release (No Codesign)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
